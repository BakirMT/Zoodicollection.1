name: zoodi_collection
description: "ZOODI Collection — Complete Cross-Platform Mobile Shopping App & Admin Management"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Firebase Core & Cloud Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  
  # State Management & DI
  flutter_bloc: ^8.1.6
  provider: ^6.1.2
  get_it: ^8.0.0
  equatable: ^2.0.5

  # UI & Navigation
  go_router: ^14.3.2
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  badges: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0

  # Payments & Utilities
  razorpay_flutter: ^1.3.7
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
